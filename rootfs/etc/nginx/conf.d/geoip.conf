# GeoIP：使用 nginx 官方 ngx_http_geoip_module（自 nginx 1.31.7 起原生支持 MaxMind DB / MMDB 格式，
# 替代旧的第三方 ngx_http_geoip2_module，无需编译、跟随 nginx 官方包升级）
#
# 可用变量（与旧第三方模块的 $geoip2_data_* 命名不同，注意修改引用处）：
#   Country 库: $geoip_country_code $geoip_country_code3 $geoip_country_name
#   City 库:    $geoip_city $geoip_city_country_code $geoip_city_country_name
#               $geoip_latitude $geoip_longitude $geoip_region $geoip_region_name
#               $geoip_postal_code $geoip_dma_code $geoip_area_code $geoip_city_continent_code
geoip_country /usr/share/geoip/GeoLite2-Country.mmdb;
geoip_city    /usr/share/geoip/GeoLite2-City.mmdb;
